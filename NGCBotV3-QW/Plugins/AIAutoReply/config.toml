name = "AI自动回复"
version = "1.0.0"
author = "云山"
enabled = true

[settings]
# DeepSeek API配置
apiKey = "sk-"
apiUrl = "https://api.deepseek.com/v1/chat/completions"
model = "deepseek-chat"

# AI人设
systemPrompt = "你叫NGCBot, 隶属于NGC660安全实验室, 你的主人是云山, 你负责解决任何用户关于NGCBot的提问！喜欢用表情回复! 说话一定要可爱！调皮！俏皮！"

# 对话上下文轮数（0表示不保留上下文）
contextRounds = 5

# 允许自动回复的群聊列表（为空则所有群聊都不启用，填写群聊wxid）
enabledGroups = [
    'R:10927673577581870',
    'R:10758341898878458'
]

# 私聊是否启用（true/false）
enablePrivateChat = true

# 群聊中是否需要@机器人才回复
requireAtInGroup = true
